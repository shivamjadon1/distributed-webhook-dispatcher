services:
  - type: web
    name: distributed-webhook-dispatcher
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: webhook-postgres
          property: connectionString

databases:
  - name: webhook-postgres
    databaseName: webhook_db
    user: webhook_user
    plan: free
    region: oregon
